name: HTTPS Proxy Regression

on:
  pull_request:
    branches:
      - feature/proxy-hub-multi-proxy
    paths:
      - proxy_pool.go
      - proxy_transport.go
      - proxy_pool_test.go
      - proxy_https_test.go
      - .github/workflows/proxy-https.yml
  workflow_dispatch:

jobs:
  proxy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l proxy_pool.go proxy_transport.go proxy_pool_test.go proxy_https_test.go)"
      - name: Test proxy parsing and transports
        run: |
          go test . -run '^(TestParseProxySettings|TestProxyPoolStickyRoundRobin|TestLoadProxyFileRetainsValidLines|TestProxyHubFetchOnce|TestHTTPConnectHandshake|TestHTTPSProxy.*|TestProxyDialContextCancellation|TestProxyRejectsUDP)$' -count=1 -timeout=10m
      - name: Test CLI proxy configuration
        run: |
          go test ./connectctl -run '^(TestProxyCheckUsageParses|TestProxyConfig.*|TestProxyTarget)$' -count=1 -timeout=5m
