name: Provider Command Syntax

on:
  push:
    branches:
      - feature/proxy-hub-multi-proxy
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Go files
        run: |
          for file in connectctl/auth.go connectctl/provider.go connectctl/provider_state.go connectctl/provider_test.go connectctl/provider_stats.go connectctl/provider_stats_test.go connectctl/provider_pacing.go connectctl/provider_pacing_test.go; do
            gofmt -e "$file" >/dev/null
          done
