name: Temporary proxy gofmt

on:
  push:
    branches:
      - fix/https-proxy-transport
    paths:
      - .github/workflows/proxy-gofmt-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/https-proxy-transport
      - name: Format touched Go files
        run: gofmt -w proxy_pool.go proxy_transport.go proxy_pool_test.go proxy_https_test.go
      - name: Commit formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy_pool.go proxy_transport.go proxy_pool_test.go proxy_https_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style(proxy): apply gofmt to HTTPS proxy changes"
            git push origin HEAD:fix/https-proxy-transport
          fi
